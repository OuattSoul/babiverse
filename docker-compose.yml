# Services de développement : PostgreSQL et Redis.
#   docker compose up -d
# puis dans backend/.env :
#   DATABASE_URL=postgres://babiverse:babiverse@localhost:5432/babiverse
#   REDIS_URL=redis://localhost:6379/0
# Sans Docker, un PostgreSQL installé localement convient aussi (voir README, « PostgreSQL »).
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: babiverse
      POSTGRES_PASSWORD: babiverse
      POSTGRES_DB: babiverse
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U babiverse"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "6379:6379"

volumes:
  pgdata:
